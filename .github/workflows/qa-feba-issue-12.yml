name: qa-feba-issue-12
on:
  push:
    branches:
      - qa/issue-12-feba
    paths:
      - scripts/probe-feba.js
      - .github/workflows/qa-feba-issue-12.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-probe:
    if: github.repository == 'YouthOpps/data-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static validation and sandbox fixture
        run: |
          node --check scripts/probe-feba.js
          node --check adapters/feba-wordpress.js
          FEBA_PROBE_FIXTURE=1 node scripts/probe-feba.js
      - name: Controlled remote publisher access probe (no publishing)
        run: node scripts/probe-feba.js
      - name: Source-specific sandbox integration QA (read-only)
        run: |
          npm ci --ignore-scripts
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { collect } from './adapters/feba-wordpress.js';
          import { fetchText, validateRecord } from './scripts/collect.js';
          const manifests = JSON.parse(readFileSync('data/sources/sources.json', 'utf8'));
          const manifest = manifests.find(item => item.source === 'bg-feba-alumni');
          const items = await collect({ manifest, fetchText, now: new Date().toISOString() });
          for (const item of items) validateRecord(item);
          const urls = new Set(items.map(item => item.url));
          if (urls.size !== items.length) throw Error('Duplicate FEBA URLs');
          if (!items.some(item => item.url.includes('/2026/10/05/'))) throw Error('Known current October 2026 FEBA call missing');
          console.log(JSON.stringify({ source: manifest.source, validRecords: items.length, hasOctober2026Call: true, sample: items.slice(0, 8).map(({ title, url }) => ({ title, url })) }, null, 2));
          NODE
