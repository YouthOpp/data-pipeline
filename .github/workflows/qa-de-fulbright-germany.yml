name: qa-de-fulbright-germany
on:
  push:
    branches:
      - qa/issue-56-fulbright-germany
    paths:
      - .github/workflows/qa-de-fulbright-germany.yml
      - scripts/verify-fulbright-germany.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-qa:
    if: github.repository == 'YouthOpps/data-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate manifest and run repository tests
        run: |
          npm run validate
          npm test
      - name: Offline Fulbright fixture QA
        run: node scripts/verify-fulbright-germany.js fixture
      - name: Read-only live Fulbright source QA (paced requests)
        run: node scripts/verify-fulbright-germany.js live
