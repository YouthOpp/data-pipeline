name: fetch-de-fulbright-germany
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-de-fulbright-germany.yml
      - scripts/verify-fulbright-germany.js
  schedule:
    - cron: '13 0/6 * * *'
permissions:
  contents: read
concurrency:
  group: youthopps-source-publishing
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'YouthOpps/data-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and validate in runner sandbox
        run: |
          npm ci --ignore-scripts
          npm run validate
          npm test
          node scripts/verify-fulbright-germany.js fixture
      - name: QA real upstream before accessing publication repository
        run: node scripts/verify-fulbright-germany.js live
      - name: Create data-source installation token
        id: data-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          token: ${{ steps.data-token.outputs.token }}
          path: data-source
          persist-credentials: true
      - name: Collect official Fulbright data to isolated checkout
        run: node scripts/publish-source.js de-fulbright-germany data-source
      - name: Verify generated source and catalog
        run: node scripts/verify-fulbright-germany.js snapshot data-source
      - name: Publish only source #56 and unified catalog
        run: |
          git -C data-source config user.name 'AI Agent'
          git -C data-source config user.email 'contact@youthopps.org'
          git -C data-source add sources/de-fulbright-germany/ catalog.json
          if ! git -C data-source diff --cached --quiet; then
            git -C data-source commit -m 'data: refresh de-fulbright-germany'
            git -C data-source push origin HEAD:main
          fi
