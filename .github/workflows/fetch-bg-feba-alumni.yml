name: fetch-bg-feba-alumni
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-bg-feba-alumni.yml
      - adapters/feba-wordpress.js
      - scripts/collect.js
      - scripts/validate.js
      - scripts/source-store.js
  schedule:
    - cron: '13 0/6 * * *'
permissions:
  contents: read
concurrency:
  group: youthopps-source-publishing
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'YouthOpps/data-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Create data-source installation token
        id: data-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          token: ${{ steps.data-token.outputs.token }}
          path: data-source
          persist-credentials: true
      - name: Validate code and source-specific QA
        run: |
          npm ci --ignore-scripts
          npm run validate
          npm test
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { collect } from './adapters/feba-wordpress.js';
          import { fetchText, validateRecord } from './scripts/collect.js';
          const manifest = JSON.parse(readFileSync('data-source/sources/bg-feba-alumni/metadata.json', 'utf8'));
          const rows = await collect({ manifest, fetchText, now: new Date().toISOString() });
          for (const row of rows) validateRecord(row);
          if (!rows.some(row => row.url.includes('/2026/10/05/'))) throw Error('Expected primary FEBA call missing');
          if (rows.some(row => /отличи|партньори на представянето/i.test(row.title))) throw Error('False-positive alumni news');
          console.log('FEBA QA verified '+rows.length+' records');
          NODE
      - name: Collect reviewed source and build catalog
        run: node scripts/publish-source.js bg-feba-alumni data-source
      - name: Verify data-source artifacts before publication
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateRecord } from './scripts/collect.js';
          const prefix='data-source/sources/bg-feba-alumni/';
          const rows=JSON.parse(readFileSync(prefix+'opportunities.json','utf8'));
          const metadata=JSON.parse(readFileSync(prefix+'metadata.json','utf8'));
          const catalog=JSON.parse(readFileSync('data-source/catalog.json','utf8'));
          if(metadata.status!=='ok'||!rows.length||metadata.record_count!==rows.length)throw Error('Invalid FEBA source metadata');
          const ids=new Set();
          for(const row of rows){
            validateRecord(row);
            if(row.source!=='bg-feba-alumni'||ids.has(row.id))throw Error('Invalid FEBA source identity or duplicate');
            ids.add(row.id);
          }
          for(const id of ids)if(!catalog.opportunities.some(row=>row.id===id))throw Error('FEBA opportunity missing from catalog');
          if(!rows.some(row=>row.url.includes('/2026/10/05/')))throw Error('Primary 2026 opportunity missing');
          console.log('Verified FEBA publication artifacts: '+rows.length+' records');
          NODE
      - name: Publish only accepted source and unified catalog
        run: |
          git -C data-source config user.name 'AI Agent'
          git -C data-source config user.email 'contact@youthopps.org'
          git -C data-source add sources/bg-feba-alumni/ catalog.json
          if ! git -C data-source diff --cached --quiet; then
            git -C data-source commit -m 'data: refresh bg-feba-alumni'
            git -C data-source push origin HEAD:main
          fi
