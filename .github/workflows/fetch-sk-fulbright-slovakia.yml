name: fetch-sk-fulbright-slovakia
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5/6 * * *'
permissions:
  contents: read
concurrency:
  group: youthopps-source-publishing
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'YouthOpps/data-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create data-source installation token
        id: data-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          repository: YouthOpps/data-source
          token: ${{ steps.data-token.outputs.token }}
          path: data-source
          persist-credentials: true
      - name: Collect and validate only this source
        run: node scripts/publish-source.js 'sk-fulbright-slovakia' data-source
      - name: Publish source and catalog in one commit
        run: |
          git -C data-source config user.name 'youthopps-bot'
          git -C data-source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C data-source add sources/sk-fulbright-slovakia/ catalog.json
          if ! git -C data-source diff --cached --quiet; then
            git -C data-source commit -m 'data: refresh sk-fulbright-slovakia'
            git -C data-source push origin HEAD:main
          fi
