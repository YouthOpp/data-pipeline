name: Fetch Comenius FMFI public opportunities

on:
  push:
    branches: [main]
    paths:
      - adapters/sk-comenius-university/**
      - .github/workflows/fetch-sk-comenius-university.yml
  schedule:
    - cron: '45 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: youthopps-uniba-publisher-v1
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.repository == 'YouthOpps/data-pipeline' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate data-source publication
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish reviewed source
        run: python -B adapters/sk-comenius-university/adapter.py --publish
        env:
          DATA_SOURCE_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          UNIBA_PACING_BOOTSTRAP: >-
            {
              "schema": 1,
              "family": "youthopps-uniba-publisher-v1",
              "not_before": 1791590356.2542448,
              "evidence": "https://github.com/YouthOpps/data-pipeline/issues/24#issuecomment-6091325325"
            }
          UNIBA_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
      - name: Preserve inert publisher pacing state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniba-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
