name: Fetch Google student and early-career programmes

on:
  push:
    branches: [main]
    paths:
      - adapters/google/**
      - .github/workflows/fetch-google.yml
  schedule:
    - cron: '21 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: youthopps-google-publisher-v1
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: >-
      github.repository == 'YouthOpps/data-pipeline' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate data-source publication
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish reviewed source
        id: collect
        run: python -B adapters/google/adapter.py --publish
        env:
          DATA_SOURCE_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_PACING_BOOTSTRAP: '{"schema":1,"family":"youthopps-google-publisher-v1","not_before":1791660757.3933005,"evidence":"https://github.com/YouthOpps/data-pipeline/issues/111#issuecomment-6101368801"}'
          GOOGLE_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
      - name: Preserve inert publisher pacing state
        if: always() && steps.collect.outputs.pacing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: google-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
