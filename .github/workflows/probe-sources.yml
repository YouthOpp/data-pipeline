name: Probe configured sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source ID to probe, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate && npm test
      - name: Probe source metadata without publishing
        env:
          PROBE_SOURCE: ${{ inputs.source }}
        run: |
          if [ "$PROBE_SOURCE" = all ]; then
            npm run probe -- --all
          else
            npm run probe -- --source "$PROBE_SOURCE"
          fi
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-${{ github.run_id }}
          path: dist/source-probe-report.json
          if-no-files-found: error
