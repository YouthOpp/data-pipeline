name: Fetch Mercedes-Benz public opportunities

on:
  push:
    branches: [main]
    paths:
      - adapters/de-mercedes-benz/**
      - .github/workflows/fetch-de-mercedes-benz.yml
  schedule:
    - cron: '30 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: youthopps-mercedes-publisher-v1
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: >-
      github.repository == 'YouthOpps/data-pipeline' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate data-source publication
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: YouthOpps
          repositories: data-source
          permission-contents: write
      - name: Collect and publish reviewed source
        id: collect
        run: python -B adapters/de-mercedes-benz/adapter.py --publish
        env:
          DATA_SOURCE_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MERCEDES_PACING_BOOTSTRAP: '{"schema":1,"family":"youthopps-mercedes-publisher-v1","not_before":1791665675.1339853,"evidence":"https://github.com/YouthOpps/data-pipeline/issues/115#issuecomment-6102073424"}'
          MERCEDES_PACING_ARTIFACT_PATH: ${{ runner.temp }}/pacing-state.json
      - name: Preserve inert publisher pacing state
        if: >-
          always() &&
          steps.collect.outputs.pacing_ready == 'true' &&
          steps.collect.outputs.pacing_run_id == github.run_id &&
          steps.collect.outputs.pacing_run_attempt == github.run_attempt
        uses: actions/upload-artifact@v4
        with:
          name: mercedes-pacing-state-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pacing-state.json
          if-no-files-found: error
          retention-days: 90
